---
- name: Register new hosts in NetBox
  hosts: unregistered
  become: false
  gather_facts: true
  vars:
    nb_iface: "{{ ansible_facts['default_ipv4']['interface'] }}"
    nb_address: "{{ ansible_facts['default_ipv4']['address'] }}/{{ ansible_facts['default_ipv4']['prefix'] }}"
  module_defaults:
    netbox.netbox.netbox_virtual_machine: &nb
      netbox_url: "{{ netbox_url }}"
      netbox_token: "{{ netbox_token }}"
    netbox.netbox.netbox_vm_interface: *nb
    netbox.netbox.netbox_ip_address: *nb
  tasks:
    - name: NetBox API calls
      delegate_to: localhost
      block:
        - name: Create VM
          netbox.netbox.netbox_virtual_machine:
            data:
              name: "{{ inventory_hostname }}"
              site: "Jacob's Lab"
              cluster: pve
              status: active
              virtual_machine_role: "{{ register_role }}"
              platform: "{{ ansible_facts['distribution'] | lower }}"
              tags: "{{ register_tags }}"
              description: "{{ register_description }}"
              vcpus: "{{ ansible_facts['processor_vcpus'] }}"
              memory: "{{ ansible_facts['memtotal_mb'] }}"
              custom_fields:
                os_version: "{{ ansible_facts['distribution_version'] }}"
                last_seen: "{{ ansible_facts['date_time']['date'] }}"

        - name: Create interface
          netbox.netbox.netbox_vm_interface:
            data:
              virtual_machine: "{{ inventory_hostname }}"
              name: "{{ nb_iface }}"
              enabled: true

        - name: Create IP in VRF Infra and assign it
          netbox.netbox.netbox_ip_address:
            data:
              address: "{{ nb_address }}"
              vrf: Infra
              status: active
              description: "{{ register_description }}"
              assigned_object:
                virtual_machine: "{{ inventory_hostname }}"
                name: "{{ nb_iface }}"

        - name: Set primary IPv4
          netbox.netbox.netbox_virtual_machine:
            data:
              name: "{{ inventory_hostname }}"
              primary_ip4:
                address: "{{ nb_address }}"
                vrf: Infra
