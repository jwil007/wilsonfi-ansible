---
# NetBox-first provisioning: a VM marked Planned in NetBox becomes a running,
# configured, Active LXC.   ansible-playbook playbooks/provision.yml -e target=<name>
- name: Provision | NetBox and Proxmox
  hosts: localhost
  gather_facts: false
  vars:
    provision_prefix: 10.0.10.0/24
    provision_vrf: Infra
    provision_gateway: 10.0.10.1
    provision_dns: 10.0.50.53,10.0.10.6
  module_defaults:
    netbox.netbox.netbox_vm_interface: &nb
      netbox_url: "{{ netbox_url }}"
      netbox_token: "{{ netbox_token }}"
    netbox.netbox.netbox_ip_address: *nb
    netbox.netbox.netbox_virtual_machine: *nb
    community.proxmox.proxmox:
      api_user: "{{ proxmox_api_user }}"
      api_token_id: "{{ proxmox_api_token_id }}"
      api_token_secret: "{{ proxmox_api_token_secret }}"
      validate_certs: "{{ proxmox_validate_certs }}"
  tasks:
    # ---------- NetBox: intent ----------
    - name: Require a target
      ansible.builtin.assert:
        that: target is defined
        fail_msg: "Run with -e target=<vm name>"

    - name: Look up the VM in NetBox
      ansible.builtin.set_fact:
        nb_vm: >-
          {{ query('netbox.netbox.nb_lookup', 'virtual-machines',
                   api_endpoint=netbox_url, token=netbox_token,
                   api_filter='name=' ~ target)
             | map(attribute='value') | first | default({}) }}

    - name: Only provision planned, Ansible-tagged VMs
      ansible.builtin.assert:
        that:
          - nb_vm.name is defined
          - nb_vm.status.value == 'planned'
          - "'ansible' in (nb_vm.tags | map(attribute='slug'))"
        fail_msg: "{{ target }} must exist in NetBox with status Planned and tag 'ansible'"

    - name: Pick the Proxmox host (the VM's Device in NetBox, else the default)
      ansible.builtin.set_fact:
        provision_node: "{{ nb_vm.device.name if nb_vm.device else proxmox_default_node }}"

    - name: The host must be one we know, in the VM's cluster
      ansible.builtin.assert:
        that:
          - provision_node in proxmox_nodes
          - nb_vm.cluster is not none
          - nb_vm.cluster.name == proxmox_nodes[provision_node].netbox_cluster
        fail_msg: >-
          {{ target }}: host '{{ provision_node }}' must be in proxmox_nodes and
          match the VM's NetBox cluster

    - name: Allocate an IP if the VM has none
      when: nb_vm.primary_ip4 is none
      block:
        - name: Create interface eth0
          netbox.netbox.netbox_vm_interface:
            data:
              virtual_machine: "{{ target }}"
              name: eth0
              enabled: true

        - name: Take the next free IP from the prefix
          netbox.netbox.netbox_ip_address:
            data:
              prefix: "{{ provision_prefix }}"
              vrf: "{{ provision_vrf }}"
              status: active
              assigned_object:
                virtual_machine: "{{ target }}"
                name: eth0
            state: new
          register: new_ip

        - name: Make it the primary IPv4
          netbox.netbox.netbox_virtual_machine:
            data:
              name: "{{ target }}"
              primary_ip4:
                address: "{{ new_ip.ip_address.address }}"
                vrf: "{{ provision_vrf }}"

    - name: Settle on the address, host and sizing
      ansible.builtin.set_fact:
        provision_ip: "{{ new_ip.ip_address.address if new_ip is changed else nb_vm.primary_ip4.address }}"
        provision_host: "{{ proxmox_nodes[provision_node] }}"
        provision_cores: "{{ nb_vm.vcpus | default(1, true) | int }}"
        provision_memory: "{{ nb_vm.memory | default(512, true) | int }}"
        provision_disk_gb: "{{ (nb_vm.disk | default(8192, true) | int / 1024) | int }}"
        provision_onboot: "{{ (nb_vm.start_on_boot.value | default('off')) == 'on' }}"

    - name: Show the plan
      ansible.builtin.debug:
        msg: >-
          {{ target }} on {{ provision_node }} → {{ provision_ip }},
          {{ provision_cores }} vCPU, {{ provision_memory }} MB RAM,
          {{ provision_disk_gb }} GB disk, start on boot: {{ provision_onboot }}

    # ---------- Proxmox: build ----------
    - name: Create the container
      community.proxmox.proxmox:
        api_host: "{{ provision_host.api_host }}"
        node: "{{ provision_node }}"
        hostname: "{{ target }}"
        ostemplate: "{{ provision_host.lxc_template }}"
        storage: "{{ provision_host.storage }}"
        disk: "{{ provision_host.storage }}:{{ provision_disk_gb }}"
        cores: "{{ provision_cores }}"
        memory: "{{ provision_memory }}"
        swap: 512
        unprivileged: true
        features:
          - nesting=1
        netif:
          net0: "name=eth0,bridge={{ provision_host.bridge }},ip={{ provision_ip }},gw={{ provision_gateway }}"
        nameserver: "{{ provision_dns }}"
        pubkey: "{{ bootstrap_pubkey }}"
        onboot: "{{ provision_onboot }}"
        state: present
      register: pve_ct

    # Proxmox's cluster-wide guest list lags a few seconds behind a create
    - name: Start it
      community.proxmox.proxmox:
        api_host: "{{ provision_host.api_host }}"
        node: "{{ provision_node }}"
        vmid: "{{ pve_ct.vmid }}"
        state: started
      register: pve_start
      retries: 10
      delay: 3
      until: pve_start is succeeded

    - name: Wait for SSH
      ansible.builtin.wait_for:
        host: "{{ provision_ip.split('/')[0] }}"
        port: 22
        timeout: 120

    - name: Add the new host to this run's inventory
      ansible.builtin.add_host:
        name: "{{ target }}"
        groups: unregistered
        ansible_host: "{{ provision_ip.split('/')[0] }}"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=accept-new"
        # Not in the NetBox inventory until it's Active, so hand over the
        # NetBox values roles expect (same names nb_inventory uses)
        primary_ip4: "{{ provision_ip.split('/')[0] }}"
        device_roles: "{{ [nb_vm.role.slug] if nb_vm.role else [] }}"
        netbox_tags: "{{ nb_vm.tags | map(attribute='slug') | list }}"
        cluster: "{{ nb_vm.cluster.name }}"
        cluster_device:
          name: "{{ provision_node }}"

# ---------- Configure, then hand over to NetBox ----------
- name: Provision | Bootstrap
  ansible.builtin.import_playbook: bootstrap.yml

- name: Provision | Baseline
  ansible.builtin.import_playbook: baseline.yml

- name: Provision | Observed facts to NetBox
  ansible.builtin.import_playbook: netbox-sync-facts.yml

- name: Provision | Mark active in NetBox
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Status planned → active
      netbox.netbox.netbox_virtual_machine:
        netbox_url: "{{ netbox_url }}"
        netbox_token: "{{ netbox_token }}"
        data:
          name: "{{ target }}"
          status: active
