---
- name: Harden SSH
  hosts: tags_ansible:unregistered
  become: true
  tasks:
    - name: Disable ssh socket activation
      ansible.builtin.systemd_service:
        name: ssh.socket
        enabled: false
        state: stopped
      notify: Restart ssh

    - name: Ensure ssh daemon is enabled and running
      ansible.builtin.systemd_service:
        name: ssh.service
        enabled: true
        state: started

    - name: Set sshd options
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?\s*{{ item.key }}\s'
        line: "{{ item.key }} {{ item.value }}"
        validate: /usr/sbin/sshd -t -f %s
      loop:
        - { key: PermitRootLogin, value: "no" }
        - { key: PasswordAuthentication, value: "no" }
      notify: Restart ssh

  handlers:
    - name: Restart ssh
      ansible.builtin.systemd_service:
        name: ssh.service
        state: restarted
