---
# Standard config for every managed host. Safe to rerun; with --check it is
# the configuration-drift check. Run one part with --tags, e.g. --tags motd
- name: Baseline
  hosts: "{{ target | default('tags_ansible:unregistered') }}"
  become: true
  roles:
    - role: users
      tags: users
    - role: ssh_hardening
      tags: ssh
    - role: motd
      tags: motd
