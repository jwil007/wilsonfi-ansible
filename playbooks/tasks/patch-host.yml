---
- name: Record failed units before patching
  ansible.builtin.command: systemctl list-units --failed --plain --no-legend
  register: failed_before
  changed_when: false

- name: Upgrade all packages
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
    autoremove: true

- name: Check whether a reboot is required
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_flag

- name: Reboot and wait for it to come back
  ansible.builtin.reboot:
    reboot_timeout: 300
  when:
    - reboot_flag.stat.exists
    - inventory_hostname != 'ansible-ctl'

- name: Flag the control node for a manual reboot
  ansible.builtin.debug:
    msg: "ansible-ctl needs a reboot - do it by hand after this run"
  when:
    - reboot_flag.stat.exists
    - inventory_hostname == 'ansible-ctl'

- name: Record failed units after patching
  ansible.builtin.command: systemctl list-units --failed --plain --no-legend
  register: failed_after
  changed_when: false

- name: No new failed units
  vars:
    before: "{{ failed_before.stdout_lines | map('split') | map('first') | list }}"
    after: "{{ failed_after.stdout_lines | map('split') | map('first') | list }}"
  ansible.builtin.assert:
    that: after | difference(before) | length == 0
    fail_msg: "New failed units on {{ inventory_hostname }}: {{ after | difference(before) }}"
