---
# NetBox -> Kea on every Kea server. serial: 1 = one server at a time, so both
# HA peers are never reloading at once; any_errors_fatal = if the first server
# fails, the second is left alone.
- name: Configure Kea DHCPv4 from NetBox
  hosts: "{{ target | default('tags_kea_dhcp_server') }}"
  serial: 1
  any_errors_fatal: true
  become: false
  gather_facts: false
  roles:
    - kea_dhcp
