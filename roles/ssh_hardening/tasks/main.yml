---
# Proxmox's Debian templates enable socket activation, which breaks reload.
- name: Disable ssh socket activation
  ansible.builtin.systemd_service:
    name: ssh.socket
    enabled: false
    state: stopped
  notify: Restart ssh

- name: Ensure the ssh daemon is enabled and running
  ansible.builtin.systemd_service:
    name: ssh.service
    enabled: true
    state: started

- name: Set sshd options
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?\s*{{ item.key }}\s'
    line: "{{ item.key }} {{ item.value }}"
    validate: /usr/sbin/sshd -t -f %s
  loop: "{{ ssh_hardening_settings | dict2items }}"
  notify: Restart ssh
